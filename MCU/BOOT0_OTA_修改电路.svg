<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <style>
    .wire { stroke:#087d49; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .part { stroke:#a91515; stroke-width:4; fill:white; }
    .text { font-family:Arial, 'Microsoft YaHei', sans-serif; fill:#315b80; font-size:29px; }
    .title { font-family:Arial, 'Microsoft YaHei', sans-serif; fill:#124b98; font-size:39px; font-weight:bold; }
    .note { font-family:Arial, 'Microsoft YaHei', sans-serif; fill:#bf1d1d; font-size:30px; font-weight:bold; }
    .small { font-family:Arial, 'Microsoft YaHei', sans-serif; fill:#315b80; font-size:23px; }
    .node { fill:#087d49; }
  </style>

  <rect width="1400" height="980" fill="#fffefd"/>

  <!-- USER switch: standalone GPIO input -->
  <text x="50" y="65" class="title">USER_SW（普通 GPIO 输入）</text>
  <text x="70" y="270" class="text">USER_SW → MCU GPIO</text>
  <path d="M70 290 H290" class="wire"/>
  <circle cx="290" cy="290" r="8" class="node"/>
  <path d="M290 290 V145" class="wire"/>
  <path d="M270 145 L290 115 L310 145" class="part"/>
  <text x="245" y="105" class="text">+3V3</text>
  <rect x="275" y="175" width="30" height="65" class="part"/>
  <text x="325" y="215" class="text">R3 10kΩ</text>
  <path d="M290 240 V290" class="wire"/>
  <path d="M290 290 V390" class="wire"/>
  <line x1="270" y1="340" x2="310" y2="340" class="part"/>
  <line x1="270" y1="355" x2="310" y2="355" class="part"/>
  <text x="145" y="355" class="text">C3 10nF</text>
  <path d="M290 355 V405" class="wire"/>
  <path d="M260 405 H320 M268 417 H312 M278 429 H302" class="part"/>
  <text x="335" y="430" class="text">GND</text>
  <path d="M290 290 H405" class="wire"/>
  <circle cx="425" cy="290" r="11" class="part"/>
  <circle cx="520" cy="290" r="11" class="part"/>
  <path d="M435 275 L510 250" class="part"/>
  <path d="M405 290 H414 M531 290 H585 V390" class="wire"/>
  <text x="428" y="230" class="text">SW1</text>
  <path d="M555 390 H615 M563 402 H607 M573 414 H597" class="part"/>
  <text x="625" y="415" class="text">GND</text>

  <!-- BOOT0 debug: exact series pull-high path -->
  <text x="770" y="65" class="title">BOOT0（ROM 救援 / 调试）</text>
  <text x="767" y="105" class="small">正常状态：R5 将 BOOT0 固定拉低</text>
  <path d="M850 145 V120" class="wire"/>
  <path d="M830 145 L850 115 L870 145" class="part"/>
  <text x="805" y="105" class="text">+3V3</text>
  <path d="M850 145 V180" class="wire"/>
  <rect x="835" y="180" width="30" height="70" class="part"/>
  <text x="880" y="222" class="text">R4 1kΩ</text>
  <path d="M850 250 V310 H930" class="wire"/>
  <circle cx="950" cy="310" r="11" class="part"/>
  <circle cx="1045" cy="310" r="11" class="part"/>
  <path d="M960 295 L1035 270" class="part"/>
  <path d="M930 310 H939 M1056 310 H1110 V405" class="wire"/>
  <text x="940" y="250" class="text">SW2  BOOT_DEBUG</text>
  <text x="782" y="350" class="small">按住时：+3V3 → R4 → SW2 → BOOT0</text>
  <circle cx="1110" cy="405" r="8" class="node"/>
  <path d="M1110 405 H1285" class="wire"/>
  <text x="1120" y="390" class="text">BOOT0 → STM32F769 BOOT0</text>
  <path d="M1110 405 V465" class="wire"/>
  <rect x="1095" y="465" width="30" height="70" class="part"/>
  <text x="1145" y="510" class="text">R5 10kΩ</text>
  <path d="M1110 535 V575" class="wire"/>
  <path d="M1080 575 H1140 M1088 587 H1132 M1098 599 H1122" class="part"/>
  <text x="1152" y="602" class="text">GND</text>

  <!-- NRST -->
  <text x="50" y="550" class="title">NRST（独立复位按键）</text>
  <text x="70" y="750" class="text">NRST → STM32F769 NRST</text>
  <path d="M70 770 H290" class="wire"/>
  <circle cx="290" cy="770" r="8" class="node"/>
  <path d="M290 770 V625" class="wire"/>
  <path d="M270 625 L290 595 L310 625" class="part"/>
  <text x="245" y="585" class="text">+3V3</text>
  <rect x="275" y="655" width="30" height="65" class="part"/>
  <text x="325" y="695" class="text">R6 10kΩ</text>
  <path d="M290 720 V770" class="wire"/>
  <path d="M290 770 V870" class="wire"/>
  <line x1="270" y1="820" x2="310" y2="820" class="part"/>
  <line x1="270" y1="835" x2="310" y2="835" class="part"/>
  <text x="125" y="835" class="text">C4 100nF</text>
  <path d="M290 835 V885" class="wire"/>
  <path d="M260 885 H320 M268 897 H312 M278 909 H302" class="part"/>
  <text x="335" y="910" class="text">GND</text>
  <path d="M290 770 H405" class="wire"/>
  <circle cx="425" cy="770" r="11" class="part"/>
  <circle cx="520" cy="770" r="11" class="part"/>
  <path d="M435 755 L510 730" class="part"/>
  <path d="M405 770 H414 M531 770 H585 V870" class="wire"/>
  <text x="430" y="710" class="text">SW3  RESET</text>
  <path d="M555 870 H615 M563 882 H607 M573 894 H597" class="part"/>
  <text x="625" y="895" class="text">GND</text>

  <!-- Notes -->
  <rect x="715" y="685" width="620" height="205" rx="16" fill="none" stroke="#c91a1a" stroke-width="3"/>
  <text x="755" y="750" class="note">正常 OTA：BOOT0 固定为低</text>
  <text x="755" y="805" class="note">ROM 救援：按住 BOOT_DEBUG，</text>
  <text x="755" y="850" class="note">再短按 RESET；随后松开 BOOT_DEBUG</text>
</svg>
